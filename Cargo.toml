[workspace]
resolver = "2"
members = [
    "crates/dots-core",
    "crates/dots-storage",
    "crates/dots-ipc",
    "crates/dots-engines",
    "crates/dots-flexi",
    "crates/dots-runtime",
    "apps/desktop/src-tauri", "crates/dots-flexi",
]

[workspace.package]
version = "0.4.20"
edition = "2024"
license = "UNLICENSED"
authors = ["C2S"]

[workspace.dependencies]
dots-core = { path = "crates/dots-core" }
dots-storage = { path = "crates/dots-storage" }
dots-ipc = { path = "crates/dots-ipc" }
dots-engines = { path = "crates/dots-engines" }
dots-flexi = { path = "crates/dots-flexi" }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "gzip"] }
keyring = { version = "3", features = ["apple-native"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "process", "signal", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
ts-rs = { version = "11", features = ["serde-compat", "chrono-impl"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rand = "0.9"
hex = "0.4"
base64 = "0.22"
subtle = "2"
libc = "0.2"
dirs = "6"
tempfile = "3"
sha2 = "0.10"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
