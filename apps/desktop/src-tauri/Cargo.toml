[package]
name = "desktop"
version.workspace = true
description = "DOTS - plataforma desktop de agentes autonomos"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
dots-core.workspace = true
dots-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
libc.workspace = true
base64.workspace = true
tauri-plugin-dialog = "2"
# sem o recurso "zip" (so o Windows usa; todas as versoes do zip 4 foram retiradas do crates.io)
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }

# instalacao da atualizacao no macOS sem trocar a pasta DOTS.app (ver updater::install_keeping_bundle)
[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
tar = "0.4"
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
